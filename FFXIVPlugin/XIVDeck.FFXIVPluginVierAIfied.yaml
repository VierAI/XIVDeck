name: XIVDeck (VierAI-fied)
author: KazWolfe
punchline: Turn your Elgato Stream Deck into a hotbar! Unofficial VierAI-fied fork (AI generated code).
description: |-
  This plugin allows players to use an Elgato Stream Deck as a virtual utility hot bar. Actions are called directly, meaning there is no need to set up awkward keybinds, custom macros, or any other settings.

  Note that the XIVDeck Stream Deck plugin must also be installed for this plugin to be useful. You can download the Stream Deck plugin from the linked GitHub repository, under the "Releases" section.

  Please report all problems to KazWolfe#2896 in the Dalamud Support server or by opening an Issue on GitHub.

  XIVDeck by KazWolfe - VierAI-fied

  Forked from the official XIVDeck (https://github.com/KazWolfe/XIVDeck).

  AI generated code: unofficial build, not supported by the original authors. Do not report issues from this build upstream.

  Added:
  - Stream Deck icon cache, push and prefetch
  - Live macro and gearset icon updates
  - Keys repaint for Penumbra icon mods
  - Imports the official XIVDeck settings

  Fixed:
  - Double connect when Stream Deck settings are saved
  - False "Stream Deck plugin newer" warning
  - Icon mod lookups moved to the game thread
  - 50-80 ms hitch from the key check
  - Icon cache memory is capped
